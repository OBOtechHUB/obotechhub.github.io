name: Sonda siti OBO (temporanea)
on:
  push:
    branches: [sonda-obo]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="OBO-Hub-indice-prodotti/1.0 (strumento interno OBO Italia)"
          g() { curl -sL -A "$UA" "$@"; }
          echo "=== sitemap.products.xml"; g https://www.obo.it/it-it/sitemap.products.xml > sp.xml; ls -la sp.xml; head -c 1500 sp.xml; echo; grep -o "<loc>" sp.xml | wc -l; grep -oE "<loc>[^<]+</loc>" sp.xml | head -3
          S2=$(grep -oE "<loc>[^<]+</loc>" sp.xml | sed 's/<[^>]*>//g' | head -1); case "$S2" in *.xml) echo "=== sotto-sitemap $S2"; g "$S2" > s2.xml; ls -la s2.xml; head -c 2500 s2.xml; echo; echo "url:"; grep -o "<url>" s2.xml | wc -l; echo "immagini:"; grep -o "<image:loc>" s2.xml | wc -l;; esac
          echo "=== pagina prodotto italiana"; g https://www.obo.it/it-it/prodotti/limitatore-di-corrente-di-fulmine-mcf-c-5096915.html > ip.html; python3 - <<'X'
          import re
          t=open('ip.html',encoding='utf-8',errors='ignore').read()
          for k in ['og:title','og:image','og:description','<title>']:
              i=t.find(k); print(k,':',t[i:i+300].replace('\n',' ') if i>=0 else '-')
          for j in re.findall(r'<script type="application/ld\+json"[^>]*>(.*?)</script>',t,re.S)[:2]: print('LDJSON:',j[:900])
          X
          echo "=== product highlights su OBO.global"; g https://www.obo-bettermann.com/en-xi > h.html; python3 - <<'X'
          import re,html
          t=open('h.html',encoding='utf-8',errors='ignore').read()
          i=t.find('Product highlights'); j=t.find('<h2',i+20)
          sez=t[i:j if j>0 else i+40000]
          for m in re.finditer(r'<a[^>]+href="(/en-xi/products/[^"]+\.html)"[^>]*>(.*?)</a>',sez,re.S):
              img=re.search(r'<img[^>]+src="([^"]+)"',m.group(2)); txt=re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',m.group(2)))).strip()
              print(m.group(1),'|',txt[:150],'|',img.group(1)[:160] if img else '')
          X
