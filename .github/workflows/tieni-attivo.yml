name: Tieni attivi i database Supabase

# Il piano gratuito di Supabase mette in pausa un progetto dopo circa 7 giorni senza richieste.
# Due volte a settimana una richiesta innocua (non legge né scrive dati) ai due database.
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Database di Progettazione LPS e OBO Hub
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js | head -1)
          KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' config.js | head -1)
          curl -fsS "$URL/auth/v1/health" -H "apikey: $KEY" > /dev/null && echo "LPS raggiungibile"
      - name: Database della Mappa carichi
        env:
          SUPABASE_URL: ${{ secrets.MAPPA_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.MAPPA_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "Secrets della Mappa non impostati, salto."; exit 0; fi
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/app_public_people" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{"p":{}}' > /dev/null
          echo "Mappa raggiungibile"
