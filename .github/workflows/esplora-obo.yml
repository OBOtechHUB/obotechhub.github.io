name: Esplora sito OBO (temporaneo)
on:
  push:
    branches: [esplora-obo]
permissions:
  contents: write
jobs:
  esplora:
    if: "!contains(github.event.head_commit.message, '[risultati]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seconda esplorazione
        run: bash esplora.sh
      - name: Salva i risultati sul ramo
        run: |
          rm -rf esplora-out2 && mv out2 esplora-out2 && rm -f esplora-out2/c*.js
          find esplora-out2 -size +8M -delete
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add esplora-out2 && git commit -qm "[risultati] esplorazione OBO" && git push
