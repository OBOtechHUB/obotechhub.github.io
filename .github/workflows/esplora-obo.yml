name: Esplora sito OBO (temporaneo)
on:
  push:
    branches: [esplora-obo]
permissions:
  contents: write
jobs:
  esplora:
    if: "!contains(github.event.head_commit.message, '[risultati]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sonda API
        run: bash esplora.sh
      - name: Salva i risultati sul ramo
        run: |
          rm -rf esplora-out11 && mv out11 esplora-out11 && rm -rf prodotti
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add esplora-out11 && git commit -qm "[risultati] esplorazione OBO" && git push
