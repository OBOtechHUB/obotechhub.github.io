name: Esplora sito OBO (temporaneo)
on:
  push:
    branches: [esplora-obo]
permissions:
  contents: write
jobs:
  esplora:
    if: "!contains(github.event.head_commit.message, '[risultati]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica pagine
        run: |
          mkdir -p out && cd out
          UA="Mozilla/5.0 (OBO Hub; ufficio tecnico OBO Italia)"
          B=https://www.obo-bettermann.com
          for u in /robots.txt /sitemap.xml /en-xi/products /en-xi/products/surge-protection /en-xi/search /it-it /it-it/prodotti; do
            f=$(echo "$u" | tr '/' '_'); curl -sSL -A "$UA" -o "pag$f.html" -w "%{http_code} %{url_effective} $u\n" "$B$u" || true
          done
          curl -sSL -A "$UA" -o obo-it.html -w "%{http_code} %{url_effective} obo.it\n" https://www.obo.it/ || true
          ls -la
          # script js referenziati
          grep -hoE '(src|href)="[^"]+\.js[^"]*"' pag_en-xi_products.html | sed -E 's/^(src|href)="//; s/"$//' | sort -u > js.txt || true
          cat js.txt
          i=0; while read j; do i=$((i+1)); case "$j" in http*) url="$j";; //*) url="https:$j";; *) url="$B$j";; esac; curl -sSL -A "$UA" -o "js$i.js" "$url" || true; done < js.txt
          grep -hoE '"(/[a-zA-Z0-9_./-]*(api|search|suche|graphql|query|autocomplete|suggest)[a-zA-Z0-9_./?=&-]*)"' *.js *.html 2>/dev/null | sort | uniq -c | sort -rn | head -80 > endpoint.txt || true
          grep -hoE 'https?://[a-zA-Z0-9.-]+(algolia|elastic|search|api|solr|typesense|meili|coveo|findologic|doofinder|klevu|factfinder)[a-zA-Z0-9./_-]*' *.js *.html 2>/dev/null | sort | uniq -c | sort -rn | head -40 >> endpoint.txt || true
          cat endpoint.txt
      - name: Salva i risultati sul ramo
        run: |
          rm -rf esplora-out && mv out esplora-out
          find esplora-out -size +3M -delete
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add esplora-out && git commit -qm "[risultati] esplorazione OBO" && git push
