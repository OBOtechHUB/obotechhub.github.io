name: Aggiorna prodotti OBO

# Ogni notte rilegge le sitemap di obo.it e i dettagli dei prodotti dall'API pubblica del sito OBO,
# aggiorna prodotti/dati/ e lo salva nel repository. La pubblicazione parte subito dopo (pubblica.yml).
on:
  schedule:
    - cron: "17 2 * * *"   # 03:17 ora italiana d'inverno
  workflow_dispatch:
  push:
    branches: [main]
    paths: [strumenti/prodotti/**, .github/workflows/prodotti.yml]

permissions:
  contents: write

concurrency:
  group: prodotti
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aggiorna l'indice
        run: python3 strumenti/prodotti/aggiorna.py
      - name: Salva se è cambiato qualcosa
        run: |
          git config user.name "OBO Hub (aggiornamento prodotti)"
          git config user.email "actions@github.com"
          git add prodotti/dati
          if git diff --cached --quiet; then echo "Nessuna modifica"; exit 0; fi
          git commit -qm "Prodotti OBO: aggiornamento del $(date +%F)"
          git pull -q --rebase && git push -q
