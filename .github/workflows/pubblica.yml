name: Pubblica OBO Hub (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # i salvataggi fatti da GitHub Actions non fanno partire altri flussi: si pubblica dopo l'aggiornamento notturno
  workflow_run:
    workflows: ["Aggiorna prodotti OBO"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepara il sito (OBO Hub + Mappa carichi)
        env:
          # Supabase della Mappa carichi (quello usato finora con Lovable)
          MAPPA_SUPABASE_URL: ${{ secrets.MAPPA_SUPABASE_URL }}
          MAPPA_SUPABASE_ANON_KEY: ${{ secrets.MAPPA_SUPABASE_ANON_KEY }}
        run: |
          # Il sito pubblicato ha sempre gli stessi indirizzi: i file del repository sono solo ordinati in cartelle.
          mkdir -p site/mappa-carichi site/torrette site/lps site/prodotti/dati
          cp hub/* site/ 2>/dev/null || true          # OBO Hub: pagina iniziale (le sottocartelle non vengono copiate qui)
          cp hub/icone/* site/                         # icone di OBO Hub
          cp comune/* site/                            # file usati da tutte le app (barra "Aggiorna app", pagina 404)
          cp .nojekyll site/
          cp mappa-carichi/index.html mappa-carichi/i18n-en.js mappa-carichi/manifest.webmanifest mappa-carichi/sw.js mappa-carichi/install.js mappa-carichi/icone/* site/mappa-carichi/
          cp torrette/*.html torrette/*.js site/torrette/
          cp prodotti/*.html prodotti/*.js site/prodotti/ 2>/dev/null || true
          # dati dei prodotti per l'app (le cache complete restano solo nel repository)
          for f in prodotti categorie notizie pagine novita stato; do cp prodotti/dati/$f.json site/prodotti/dati/ 2>/dev/null || true; done
          cp comune/vecchio-lps.html site/lps/index.html   # vecchi link /lps/ → nuovo nome dell'app LPS
          # Senza secrets dedicati la Mappa usa lo stesso database di OBO Hub / Progettazione LPS (config.js).
          if [ -z "$MAPPA_SUPABASE_URL" ] || [ -z "$MAPPA_SUPABASE_ANON_KEY" ]; then
            MAPPA_SUPABASE_URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' hub/config.js | head -1)
            MAPPA_SUPABASE_ANON_KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' hub/config.js | head -1)
            echo "Mappa carichi: uso il database di OBO Hub ($MAPPA_SUPABASE_URL)"
          fi
          sed -i "s|__SUPABASE_URL__|${MAPPA_SUPABASE_URL}|g; s|__SUPABASE_ANON_KEY__|${MAPPA_SUPABASE_ANON_KEY}|g" site/mappa-carichi/index.html
          if grep -q "__SUPABASE_" site/mappa-carichi/index.html; then echo "Segnaposto non sostituiti"; exit 1; fi

      - name: Versione pubblicata (per il pulsante "Aggiorna app")
        run: |
          echo "{\"versione\":\"${GITHUB_SHA}\"}" > site/version.json
          sed -i "s/__VERSIONE__/${GITHUB_SHA}/" site/aggiorna.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
