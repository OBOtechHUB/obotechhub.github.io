name: Pubblica OBO Hub (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepara il sito (OBO Hub + Mappa carichi)
        env:
          # Supabase della Mappa carichi (quello usato finora con Lovable)
          MAPPA_SUPABASE_URL: ${{ secrets.MAPPA_SUPABASE_URL }}
          MAPPA_SUPABASE_ANON_KEY: ${{ secrets.MAPPA_SUPABASE_ANON_KEY }}
        run: |
          mkdir -p site/mappa-carichi
          cp index.html config.js manifest.webmanifest sw.js install.js aggiorna.js icona-192.png icona-512.png icona-maskable-512.png apple-touch-icon.png favicon-32.png .nojekyll site/
          cd mappa-carichi
          cp index.html i18n-en.js manifest.webmanifest sw.js install.js icon-192.png icon-512.png apple-touch-icon.png ../site/mappa-carichi/
          cd ..
          # Senza secrets dedicati la Mappa usa lo stesso database di OBO Hub / Progettazione LPS (config.js).
          if [ -z "$MAPPA_SUPABASE_URL" ] || [ -z "$MAPPA_SUPABASE_ANON_KEY" ]; then
            MAPPA_SUPABASE_URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js | head -1)
            MAPPA_SUPABASE_ANON_KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' config.js | head -1)
            echo "Mappa carichi: uso il database di OBO Hub ($MAPPA_SUPABASE_URL)"
          fi
          sed -i "s|__SUPABASE_URL__|${MAPPA_SUPABASE_URL}|g; s|__SUPABASE_ANON_KEY__|${MAPPA_SUPABASE_ANON_KEY}|g" site/mappa-carichi/index.html
          if grep -q "__SUPABASE_" site/mappa-carichi/index.html; then echo "Segnaposto non sostituiti"; exit 1; fi

      - name: Versione pubblicata (per il pulsante "Aggiorna app")
        run: |
          echo "{\"versione\":\"${GITHUB_SHA}\"}" > site/version.json
          sed -i "s/__VERSIONE__/${GITHUB_SHA}/" site/aggiorna.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
