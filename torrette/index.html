  /* ── Guida «Trova la torretta giusta» (torrette/sorgente/guida.jsx): colori del tema, niente inversione ── */

  .guida .g-nastro { display:flex; align-items:flex-start; gap:16px; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; padding:18px max(28px, calc((100vw - 1044px) / 2)) 8px; margin:0 calc(-1 * max(28px, (100vw - 1100px) / 2 + 28px)); overscroll-behavior-x:contain; }

  .guida .g-carta { flex:0 0 min(900px, calc(100vw - 64px)); scroll-snap-align:center; border-radius:28px; padding:26px 28px 28px; box-sizing:border-box; transition:transform .3s ease, opacity .3s ease; opacity:.5; transform:scale(.96); cursor:pointer;
    --testo:#282a31; --tenue:#41525d; --carta:rgba(255,255,255,.62); --bordo:rgba(20,30,40,.16); --grigio:rgba(255,255,255,.5); --scelto:#fff; --ardesia:#33434d; --arancio-scuro:#8a4b00;

  .guida .g-fig svg { width:100%; max-width:320px; height:auto; display:block; }
  .guida .g-fig svg[width="44"] { width:52px; height:52px; }
  .guida .g-riga { display:flex; align-items:flex-start; gap:10px; padding:12px 14px 14px; width:100%; box-sizing:border-box; }
  .guida .g-st { display:block; min-width:0; }
  .guida .g-st b { display:block; font-size:calc(16px * var(--zoom,1)); }
  .guida .g-st small { display:block; margin-top:3px; color:var(--tenue); font-size:calc(13.5px * var(--zoom,1)); line-height:1.35; font-weight:400; }
  .guida .g-spunta { flex:none; width:22px; height:22px; margin-top:1px; border-radius:50%; display:grid; place-items:center; border:2px solid var(--tenue); color:transparent; font-size:13px; font-weight:800; transition:.15s; box-sizing:border-box; }
  .guida .g-scelta.attiva .g-spunta { background:#282a31; border-color:#282a31; color:#fff; }
  .guida .g-due { display:grid; grid-template-columns:minmax(0, 1.35fr) minmax(0, 1fr); gap:24px; align-items:start; }
  .guida .g-tavola { background:var(--grigio); border:1px solid var(--bordo); border-radius:14px; padding:18px; }
  .guida .g-tavola svg { width:100%; height:auto; display:block; }
  .guida .g-campi { display:grid; gap:12px; min-width:0; }
  .guida .g-campi.larghi { gap:14px; }
  .guida label { font-weight:700; font-size:calc(14px * var(--zoom,1)); color:var(--testo); }
  .guida .g-num { display:flex; align-items:center; gap:8px; max-width:240px; }
  .ufs-radice .guida input.g { color-scheme:light; width:100%; min-width:0; box-sizing:border-box; font:inherit; font-size:22px; font-weight:700; padding:10px 14px; border:2px solid var(--bordo); border-radius:12px; background:var(--carta); color:var(--testo); font-variant-numeric:tabular-nums; }
  .guida input.g:focus-visible { outline:none; border-color:var(--arancio); }
  .guida .g-num span { color:var(--tenue); font-weight:700; }
  .guida .g-rapide, .guida .g-riassunto { display:flex; flex-wrap:wrap; gap:8px; }
  .guida .g-pill { border:1px solid var(--bordo); background:var(--carta); color:var(--testo); padding:7px 14px; cursor:pointer; font-size:calc(14px * var(--zoom,1)); }
  .guida .g-carta .g-pill.attiva { background:#282a31; border-color:#282a31; color:#fff; }
  .guida .g-suggerimento { margin:0; color:var(--tenue); font-size:calc(14px * var(--zoom,1)); }
  .guida .g-conta { display:flex; align-items:center; gap:14px; }
  .guida .g-conta button { width:48px; height:48px; border:2px solid var(--bordo); background:var(--carta); color:var(--testo); font-size:24px; cursor:pointer; }
  .guida .g-conta output { min-width:56px; text-align:center; font-size:34px; font-weight:800; font-variant-numeric:tabular-nums; }
  .guida .g-riassunto { margin-bottom:18px; }
  .guida .g-alternative { border-left:4px solid var(--arancio); background:var(--carta); padding:10px 14px; margin:0 0 16px; }
  .guida .g-alternative > b { display:block; margin-bottom:8px; }
  .g-vista { display:flex; flex-wrap:wrap; gap:12px; align-items:center; border:1px solid var(--bordo); background:var(--carta); padding:12px 14px; margin-bottom:16px; }
  .g-vista-fig { flex:1 1 220px; max-width:320px; min-width:0; }
  .g-vista-fig svg { width:100%; height:auto; display:block; }
  .g-vista p { flex:1 1 100%; margin:0; font-size:calc(14px * var(--zoom,1)); }
  .guida .g-elenco { display:grid; gap:12px; }
  .guida .g-elenco h4 { margin:10px 0 0; font-size:calc(16px * var(--zoom,1)); }
  .guida .g-elenco details { border-top:1px solid var(--bordo); padding-top:12px; display:grid; gap:12px; }
  .guida .g-elenco summary { cursor:pointer; color:var(--tenue); font-weight:600; margin-bottom:12px; }
  .guida .g-ris { display:flex; gap:0; align-items:stretch; background:#fff; border:1px solid var(--bordo); border-left:5px solid #1d7a45; border-radius:14px; overflow:hidden; }
  .guida .g-ris.parziale { border-left-color:var(--arancio); }
  .guida .g-ris.ko { border-left-color:var(--tenue); opacity:.8; margin-bottom:10px; }
  .guida .g-ris img { width:170px; object-fit:cover; flex:none; }
  .guida .g-ris-c { flex:1; min-width:0; padding:14px 16px; display:grid; gap:8px; align-content:start; }
  .guida .g-ris-t { display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; }
  .guida .g-ris h3 { margin:0; font-size:calc(18px * var(--zoom,1)); }
  .guida .g-fam { color:var(--tenue); font-size:calc(13px * var(--zoom,1)); }
  .guida .g-nota, .guida .g-no { margin:0; font-size:calc(14px * var(--zoom,1)); }
  .guida .g-nota { color:var(--arancio-scuro); }
  .guida .g-no { color:var(--tenue); }
  .guida .ufs-car span { background:rgba(255,255,255,.7) !important; color:var(--testo) !important; border-color:var(--bordo) !important; }
  .guida .ufs-car svg { stroke:currentColor !important; }
  .guida .g-vai { align-self:center; margin:0 16px; flex:none; background:var(--arancio); color:#fff; border:0; padding:12px 20px; font-size:calc(15px * var(--zoom,1)); cursor:pointer; }
  .guida .g-piede { position:fixed; left:0; right:0; bottom:0; z-index:15; background:var(--carta); border-top:1px solid var(--bordo); box-shadow:0 -6px 18px rgba(0,0,0,.08); padding:10px 0 calc(10px + env(safe-area-inset-bottom)); }
  .guida .g-piede-riga { display:flex; align-items:center; gap:12px; }
  .guida .g-btn { border:1px solid var(--bordo); background:var(--carta); color:var(--testo); padding:11px 18px; font-size:calc(15px * var(--zoom,1)); cursor:pointer; }
  .guida .g-btn:disabled { opacity:.35; cursor:default; }
  .guida .g-btn.primario { background:var(--arancio); border-color:var(--arancio); color:#fff; }
  .guida .g-conteggio { flex:1; text-align:center; color:var(--tenue); font-size:calc(14px * var(--zoom,1)); }
  .guida .g-conteggio b { color:#1d7a45; font-size:1.25em; }
  .guida .g-conteggio.zero b { color:var(--rosso, #b3261e); }
  @media (max-width: 760px) {
    .guida .g-dentro { padding:0 14px; }
    .guida .g-nastro { gap:10px; padding:14px 14px 6px; margin:0 -14px; }
    .guida .g-carta { flex-basis:calc(100vw - 44px); padding:18px 16px 20px; border-radius:24px; }
    .guida .g-carta:not(.ora) { max-height:300px; }
    .guida .g-due { grid-template-columns:1fr; gap:14px; }
    .guida h2 { font-size:calc(23px * var(--zoom,1)) !important; }
    .guida .g-passi em { display:none; }
    .guida .g-passi li.ora em { display:inline; }
    .guida .g-scelta:not(.larga) { flex-direction:row; align-items:stretch; }
    .guida .g-scelta:not(.larga) .g-fig { width:118px; flex:none; min-height:0; padding:8px; }
    .guida .g-ris { flex-direction:column; }
    .guida .g-ris img { width:100%; height:130px; }
    .guida .g-vai { align-self:stretch; margin:0 14px 14px; }
    .guida .g-conteggio small { display:none; }
    .guida .g-btn { padding:11px 12px; }
  }
  /* tema scuro: il configuratore ha colori propri; si invertono le parti (non il contenitore, così il carrello fisso resta in basso) e si rimettono dritte le foto */
  :root[data-theme="dark"] .ufs-radice > *:not(.ufs-barra):not(.guida) { background-color:#fff; filter:invert(.9) hue-rotate(180deg); }
  :root[data-theme="dark"] .ufs-radice > *:not(.ufs-barra):not(.guida) img { filter:invert(1) hue-rotate(180deg); }
  @media print { header.barra, .eroe, .schede, .noprint { display:none !important; } body { background:#fff; color:#000; } }
</style>
</head>
<body>
<div id="cancello" class="cancello"><img src="../icona-192.png" alt=""><h1 data-t="Configuratore torrette|Service outlet configurator"></h1><p id="cancelloMsg" data-t="Accesso con OBO Hub in corso…|Signing in with OBO Hub…"></p><p><a class="btn btn-primario" id="cancelloBtn" href="../" hidden data-t="Vai a OBO Hub|Go to OBO Hub"></a></p></div>

<div id="app" hidden>
  <header class="barra"><div class="contenitore">
    <a class="marchio" href="../" title="OBO Hub"><img src="../icona-192.png" alt=""><span><b data-t="Configuratore torrette|Service outlets"></b><small data-t="← OBO Hub|← OBO Hub"></small></span></a>
    <div class="azioni">
      <a class="ib hubtorna" href="../" title="Torna a OBO Hub" aria-label="Torna alla pagina iniziale di OBO Hub"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><small>OBO Hub</small></a>
      <a class="ib" href="../novita.html?app=torrette" title="Novità delle app"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg><small data-t="Novità|News"></small></a>
      <div class="impost"><button class="ib" id="aspetto" aria-haspopup="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19 9 5l5 14M5.8 14h6.4M15 19l3-8 3 8M15.9 16.5h4.2"/></svg><small data-t="Aspetto|Display"></small></button><div class="pannello-impost" id="pannelloAspetto" role="dialog" hidden></div></div>
    </div>
  </div></header>
  <section class="eroe"><div class="contenitore">
    <h1 data-t="Configuratore torrette e sistemi sottopavimento|Service outlets and underfloor systems"></h1>
    <p data-t="Scegli famiglia e modello oppure trova il sistema dai requisiti; aggiungi le configurazioni al carrello e salvale nel progetto. Distinta con i codici OBO.|Choose family and model or find the system from the requirements; add configurations to the cart and save them in the project. Parts list with OBO codes."></p>
  </div></section>
  <main class="contenitore">
    <section class="progetto noprint" aria-label="Stato del salvataggio">
      <span id="chipSalvato" class="chip"></span>
      <a class="pill pill-arancio" href="#boxProgetto" id="vaiSalva" data-t="Salva nel progetto ↓|Save to project ↓"></a>
      <button type="button" class="pill" id="nuovaConf" data-t="Nuova configurazione|New configuration"></button>
      <button type="button" class="pill" id="csv" data-t="Scarica distinta (Excel)|Download parts list (Excel)"></button>
    </section>
  </main>
  <div id="ufs"></div>
  <div class="contenitore">
    <section class="pannello-progetto noprint" id="boxProgetto" aria-labelledby="titProgetto">
      <h2 id="titProgetto" data-t="Progetto (salvataggio automatico)|Project (automatic saving)"></h2>
      <p class="callout" id="aperto"></p>
      <div class="campi">
        <label><span data-t="Progetto (unico per tutte le app)|Project (shared by all apps)"></span><select id="selProgetto"></select></label>
        <label><span data-t="Nome della configurazione|Configuration name"></span><input id="nomeConf" maxlength="200"></label>
      </div>
      <div class="campi" id="nuovoProg" hidden>
        <label><span data-t="Numero progetto CRM|CRM project number"></span><input id="npCodice" maxlength="100" placeholder="P-2026-0142"></label>
        <label><span data-t="Nome del progetto|Project name"></span><input id="npNome" maxlength="160"></label>
        <label><span data-t="Comune|Town"></span><input id="npComune" maxlength="120"></label>
      </div>
      <div class="strumenti">
        <button type="button" class="btn btn-primario" id="salvaProg" data-t="Salva nel progetto|Save to project"></button>
        <button type="button" class="pill" id="copiaLink" data-t="Copia link|Copy link"></button>
        <button type="button" class="pill" id="mandaEmail" data-t="Invia per email|Send by email"></button>
        <a class="pill" href="../progetti.html" data-t="Tutti i progetti|All projects"></a>
        <span id="statoCloud" class="nota" role="status"></span>
      </div>
      <p class="nota"><a href="precedente.html" data-t="Apri la versione precedente del configuratore|Open the previous version of the configurator"></a></p>
    </section>
  </div>
</div>

<script src="../manutenzione.js" data-sezione="app:torrette"></script>
<script src="../aggiorna.js" data-versione="../version.json" data-app="torrette"></script>
<script src="./ufs.js?v=6f58ff036c"></script>
<script type="module" src="./ufs-app.js?v=eb0bec8f15"></script>

<script src="../piede.js"></script>
</body>
