<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Configuratore torrette · OBO Hub</title>
<meta name="theme-color" content="#ffffff">
<script>try{var z=Number(localStorage.getItem("obo-zoom"));if(z)document.documentElement.style.setProperty("--zoom",String(z))}catch(e){}</script>
<script>try{var t=localStorage.getItem("obo-tema");document.documentElement.dataset.theme=(t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches))?"dark":"light"}catch(e){}</script>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OBO Hub">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root { --arancio:#f39b00; --arancio-scuro:#d98a00; --ardesia:#41525d; --testo:#212529; --tenue:#6c757d; --bordo:#dee2e6; --sfondo:#fff; --grigio:#f5f6f7; --carta:#fff; --scelto:#fff4e0;
    --font:"Nimbus Sans L","Nimbus Sans","Helvetica Neue",Helvetica,Arial,sans-serif; }
  :root[data-theme="dark"] { color-scheme:dark; --testo:#eef1f3; --tenue:#a7b4bc; --bordo:#3a454d; --sfondo:#1b1f23; --grigio:#242a2f; --ardesia:#2a3238; --carta:#242a2f; --scelto:#3d3020; }
  * { box-sizing:border-box; }
  html { touch-action:pan-x pan-y; }
  html, body { margin:0; background:var(--sfondo); color:var(--testo); font-family:var(--font); }
  body { font-size:calc(15px * var(--zoom,1)); padding-bottom:env(safe-area-inset-bottom); }
  button, input, select { font:inherit; color:inherit; }
  .contenitore { max-width:1140px; margin:0 auto; padding:0 16px; }
  header.barra { position:sticky; top:0; z-index:10; background:var(--carta); box-shadow:0 2px 10px rgba(0,0,0,.06); padding-top:env(safe-area-inset-top); }
  header.barra .contenitore { display:flex; align-items:center; justify-content:space-between; gap:8px; height:64px; }
  .marchio { display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; min-width:0; }
  .marchio img { width:36px; height:36px; border-radius:9px; }
  .marchio b { font-size:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .marchio small { display:block; font-size:12px; color:var(--tenue); }
  .azioni { display:flex; gap:2px; align-items:center; }
  .ib { border:0; background:none; cursor:pointer; padding:8px; border-radius:8px; font-weight:600; font-size:14px; min-width:40px; text-decoration:none; color:inherit; }
  .ib:hover { color:var(--arancio); }
  .eroe { background:var(--ardesia); color:#fff; }
  .eroe .contenitore { padding-top:24px; padding-bottom:24px; }
  .eroe h1 { margin:0; font-size:calc(26px * var(--zoom,1)); }
  .eroe p { margin:6px 0 0; color:rgba(255,255,255,.85); }
  .schede { display:flex; gap:6px; margin:16px 0; flex-wrap:wrap; }
  .scheda { border:1px solid var(--bordo); background:var(--carta); padding:8px 16px; border-radius:999px; cursor:pointer; font-weight:600; }
  .scheda[aria-selected="true"] { background:var(--arancio); border-color:var(--arancio); color:#fff; }
  .passi { display:flex; gap:8px; margin:4px 0 16px; }
  .passo { flex:1; border-top:4px solid var(--bordo); padding-top:6px; font-size:calc(13px * var(--zoom,1)); color:var(--tenue); background:none; border-left:0; border-right:0; border-bottom:0; text-align:left; cursor:pointer; }
  .passo.fatto, .passo.attivo { border-top-color:var(--arancio); color:var(--testo); }
  .passo.attivo { font-weight:700; }
  .passo:disabled { cursor:default; }
  .griglia { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; }
  .carta { border:1px solid var(--bordo); background:var(--carta); border-radius:12px; padding:16px; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:6px; }
  .carta:hover:not(:disabled) { border-color:var(--arancio); }
  .carta:disabled { cursor:default; opacity:.65; }
  .carta h3 { margin:0; font-size:calc(17px * var(--zoom,1)); }
  .carta p { margin:0; color:var(--tenue); font-size:calc(14px * var(--zoom,1)); }
  .etichette { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
  .etichette span { font-size:calc(12px * var(--zoom,1)); background:var(--grigio); border-radius:999px; padding:2px 8px; }
  .presto { color:var(--arancio-scuro); font-weight:600; font-size:calc(13px * var(--zoom,1)); }
  .scelta { margin:0 0 18px; }
  .scelta h3 { margin:0 0 8px; font-size:calc(15px * var(--zoom,1)); }
  .opzioni { display:flex; flex-wrap:wrap; gap:8px; }
  .opz { border:1px solid var(--bordo); background:var(--carta); border-radius:10px; padding:8px 12px; cursor:pointer; text-align:left; max-width:100%; }
  .opz small { display:block; color:var(--tenue); font-size:calc(12px * var(--zoom,1)); }
  .opz[aria-pressed="true"] { border-color:var(--arancio); background:var(--scelto); box-shadow:inset 0 0 0 1px var(--arancio); }
  .due { display:grid; grid-template-columns:1fr 360px; gap:20px; align-items:start; }
  @media (max-width:860px) { .due { grid-template-columns:1fr; } .nascondi-mobile { display:none; } }
  .riepilogo { border:1px solid var(--bordo); border-radius:12px; padding:16px; background:var(--grigio); position:sticky; top:84px; }
  .riepilogo h3 { margin:0 0 8px; }
  table { width:100%; border-collapse:collapse; font-size:calc(14px * var(--zoom,1)); }
  th, td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--bordo); vertical-align:top; }
  th { color:var(--tenue); font-weight:600; font-size:calc(12px * var(--zoom,1)); }
  td.n { text-align:right; white-space:nowrap; }
  .cod { font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap; }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:10px 18px; border-radius:999px; border:1px solid transparent; font-weight:600; cursor:pointer; text-decoration:none; }
  .btn-primario { background:var(--arancio); color:#fff; }
  .btn-primario:hover { background:var(--arancio-scuro); }
  .btn-bordo { background:var(--carta); border-color:var(--bordo); }
  .riga { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px; }
  input[type=number], input[type=search], select { border:1px solid var(--bordo); background:var(--carta); border-radius:8px; padding:8px 10px; }
  input[type=search] { width:100%; max-width:520px; }
  .nota { color:var(--tenue); font-size:calc(13px * var(--zoom,1)); margin:12px 0; }
  .avviso { border-left:4px solid var(--arancio); background:var(--scelto); padding:10px 12px; border-radius:6px; margin:12px 0; font-size:calc(14px * var(--zoom,1)); }
  .vuoto { color:var(--tenue); padding:24px 0; }
  .cancello { max-width:440px; margin:12vh auto; text-align:center; padding:0 16px; }
  .cancello img { width:64px; height:64px; border-radius:14px; }
  .indietro { background:none; border:0; color:var(--arancio-scuro); cursor:pointer; font-weight:600; padding:0; margin-bottom:12px; }
  @media print { header.barra, .eroe, .schede, .noprint { display:none !important; } body { background:#fff; color:#000; } }
</style>
</head>
<body>
<div id="cancello" class="cancello"><img src="../icona-192.png" alt=""><h1 data-t="Configuratore torrette|Service outlet configurator"></h1><p id="cancelloMsg" data-t="Accesso con OBO Hub in corso…|Signing in with OBO Hub…"></p><p><a class="btn btn-primario" id="cancelloBtn" href="../" hidden data-t="Vai a OBO Hub|Go to OBO Hub"></a></p></div>

<div id="app" hidden>
  <header class="barra"><div class="contenitore">
    <a class="marchio" href="../" title="OBO Hub"><img src="../icona-192.png" alt=""><span><b data-t="Configuratore torrette|Service outlets"></b><small data-t="← OBO Hub|← OBO Hub"></small></span></a>
    <div class="azioni">
      <button class="ib" id="zMeno" title="Testo più piccolo" aria-label="Testo più piccolo">A−</button>
      <button class="ib" id="zPiu" title="Testo più grande" aria-label="Testo più grande">A+</button>
      <button class="ib" id="tema" title="Tema"></button>
      <button class="ib" id="lingua" title="Lingua / Language"></button>
    </div>
  </div></header>
  <section class="eroe"><div class="contenitore">
    <h1 data-t="Configuratore torrette|Service outlet configurator"></h1>
    <p data-t="Scegli famiglia, modello e configurazione: ottieni la distinta con i codici OBO.|Choose family, model and configuration to get the parts list with OBO codes."></p>
  </div></section>
  <main class="contenitore">
    <div class="schede noprint" role="tablist">
      <button class="scheda" role="tab" data-scheda="configura" data-t="Configura|Configure"></button>
      <button class="scheda" role="tab" data-scheda="trova" data-t="Trova|Find"></button>
      <button class="scheda" role="tab" data-scheda="distinta" id="schedaDistinta"></button>
    </div>
    <div id="vista"></div>
    <p class="nota" id="notaDati"></p>
  </main>
</div>

<script src="../aggiorna.js" data-versione="../version.json"></script>
<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";
  import { CONFIG } from "../config.js";
  import { FAMIGLIE, MODULI_DATI, NOTA_DATI } from "./dati.js";

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const leggi = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const scrivi = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };
  document.addEventListener("gesturestart", (e) => e.preventDefault());

  // ---------- lingua, tema e testo condivisi con le altre app ----------
  const en = () => leggi("obo-lingua") === "en";
  const T = (it, eng) => (en() ? eng : it);
  const N = (o, k = "") => (en() ? o[k + "en"] ?? o[k + "it"] : o[k + "it"]);
  function testiFissi() {
    document.documentElement.lang = en() ? "en" : "it";
    document.querySelectorAll("[data-t]").forEach((el) => { const [i, e] = el.dataset.t.split("|"); el.textContent = en() ? e : i; });
    $("lingua").textContent = en() ? "IT" : "EN";
    $("zMeno").title = $("zMeno").ariaLabel = T("Testo più piccolo", "Smaller text");
    $("zPiu").title = $("zPiu").ariaLabel = T("Testo più grande", "Larger text");
    const t = leggi("obo-tema"); $("tema").textContent = t === "dark" ? "☾" : t === "light" ? "☀" : "◐";
    $("tema").title = T("Tema: ", "Theme: ") + (t === "dark" ? T("scuro", "dark") : t === "light" ? T("chiaro", "light") : "auto");
    $("notaDati").textContent = N(NOTA_DATI, "");
  }
  const PASSI_ZOOM = [0.85, 0.9, 1, 1.1, 1.2, 1.3, 1.45];
  const zoom = () => { const v = Number(leggi("obo-zoom")); return PASSI_ZOOM.includes(v) ? v : 1; };
  const applicaZoom = () => document.documentElement.style.setProperty("--zoom", String(zoom()));
  const cambiaZoom = (d) => { const i = PASSI_ZOOM.indexOf(zoom()); const z = PASSI_ZOOM[Math.min(PASSI_ZOOM.length - 1, Math.max(0, i + d))]; scrivi("obo-zoom", z === 1 ? null : String(z)); applicaZoom(); };
  const applicaTema = () => { const t = leggi("obo-tema"); document.documentElement.dataset.theme = (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) ? "dark" : "light"; };
  $("zMeno").onclick = () => cambiaZoom(-1);
  $("zPiu").onclick = () => cambiaZoom(1);
  $("tema").onclick = () => { const t = leggi("obo-tema"); scrivi("obo-tema", t === "light" ? "dark" : t === "dark" ? null : "light"); applicaTema(); testiFissi(); };
  $("lingua").onclick = () => { scrivi("obo-lingua", en() ? null : "en"); testiFissi(); disegna(); };
  addEventListener("storage", (e) => { if (["obo-lingua", "obo-tema", "obo-zoom"].includes(e.key)) { applicaTema(); applicaZoom(); testiFissi(); disegna(); } });
  testiFissi();

  // ---------- accesso: sessione di OBO Hub ----------
  // In preparazione: entra solo l'amministratore. Quando sarà pronta: anche chi ha la sezione "app_torrette".
  const supabase = createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true } });
  function fuori(msg) { $("cancelloMsg").textContent = msg; $("cancelloBtn").hidden = false; }
  (async () => {
    try {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return fuori(T("Entra da OBO Hub per usare il configuratore.", "Sign in from OBO Hub to use the configurator."));
      const [{ data: aal }, { data: profilo }] = await Promise.all([
        supabase.auth.mfa.getAuthenticatorAssuranceLevel(),
        supabase.from("accessi_profili").select("ruolo, sezioni").eq("utente", session.user.id).maybeSingle(),
      ]);
      if (aal?.nextLevel === "aal2" && aal?.currentLevel !== "aal2") return fuori(T("Completa l'accesso con Authenticator da OBO Hub.", "Complete the Authenticator sign-in from OBO Hub."));
      const ok = profilo && profilo.ruolo === "admin";
      if (!ok) return fuori(T("Non hai accesso a questa app.", "You don't have access to this app."));
      $("cancello").hidden = true; $("app").hidden = false; disegna();
    } catch { fuori(T("Accesso non riuscito: riprova da OBO Hub.", "Sign-in failed: try again from OBO Hub.")); }
  })();

  // ---------- stato ----------
  const stato = { scheda: "configura", famiglia: null, modello: null, scelte: {}, modulo: MODULI_DATI[0].codice, quante: 1, cerca: "" };
  const CHIAVE_DISTINTA = "obo-torrette-distinta";
  let distinta = []; try { distinta = JSON.parse(leggi(CHIAVE_DISTINTA) || "[]"); } catch { distinta = []; }
  const salva = () => scrivi(CHIAVE_DISTINTA, JSON.stringify(distinta));

  const famiglia = () => FAMIGLIE.find((f) => f.id === stato.famiglia);
  const modello = () => famiglia()?.modelli.find((m) => m.id === stato.modello);

  function sceltePredefinite(m) { const s = {}; for (const g of m.scelte) s[g.id] = g.opzioni[0].id; return s; }

  /** Articoli della configurazione attuale (per una torretta). */
  function articoli(m, s) {
    const out = [];
    for (const g of m.scelte) { const o = g.opzioni.find((x) => x.id === s[g.id]); if (o?.articoli) out.push(...o.articoli); }
    for (const [g1, perOpz] of Object.entries(m.articoliPer ?? {})) {
      const dip = perOpz[s[g1]]; if (!dip) continue;
      for (const [g2, mappa] of Object.entries(dip)) out.push(...(mappa[s[g2]] ?? []));
    }
    if (s.dati && s.dati !== "no") { const mod = MODULI_DATI.find((x) => x.codice === stato.modulo); if (mod) out.push({ ...mod, qta: 2 }); }
    return out;
  }
  function nomeConfig(m, s) {
    return N(m, "") + " · " + m.scelte.map((g) => N(g.opzioni.find((o) => o.id === s[g.id]) ?? {}, "")).filter(Boolean).join(", ");
  }

  // ---------- disegno ----------
  function disegna() {
    if ($("app").hidden) return;
    document.querySelectorAll(".scheda").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.scheda === stato.scheda)));
    $("schedaDistinta").textContent = T("Distinta", "Parts list") + (distinta.length ? ` (${distinta.length})` : "");
    $("notaDati").hidden = stato.scheda === "distinta";
    $("vista").innerHTML = stato.scheda === "trova" ? vistaTrova() : stato.scheda === "distinta" ? vistaDistinta() : vistaConfigura();
    if (stato.scheda === "trova") { const i = $("cerca"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  }
  document.querySelectorAll(".scheda").forEach((b) => (b.onclick = () => { stato.scheda = b.dataset.scheda; disegna(); }));

  function barraPassi(n) {
    const nomi = [T("Famiglia", "Family"), T("Modello", "Model"), T("Configurazione", "Configuration")];
    return `<div class="passi">${nomi.map((x, i) => `<button class="passo ${i + 1 < n ? "fatto" : ""} ${i + 1 === n ? "attivo" : ""}" data-passo="${i + 1}" ${i + 1 >= n ? "disabled" : ""}>${i + 1}. ${esc(x)}</button>`).join("")}</div>`;
  }

  function vistaConfigura() {
    const f = famiglia(), m = modello();
    if (!f) return barraPassi(1) + `<h2>${T("Quale famiglia di torrette?", "Which service outlet family?")}</h2><div class="griglia">` + FAMIGLIE.map((x) => `
      <button class="carta" data-famiglia="${x.id}" ${x.daCompletare ? "disabled" : ""}>
        <h3>${esc(N(x, ""))}</h3><p>${esc(N(x, "descr_"))}</p>
        <div class="etichette">${x.tag.map((t) => `<span>${esc(t)}</span>`).join("")}</div>
        ${x.daCompletare ? `<span class="presto">${T("In preparazione: modelli da caricare", "In preparation: models to be added")}</span>` : `<span class="nota" style="margin:0">${x.modelli.length} ${x.modelli.length === 1 ? T("modello", "model") : T("modelli", "models")}</span>`}
      </button>`).join("") + "</div>";
    if (!m) return barraPassi(2) + `<button class="indietro" data-va="famiglie">← ${T("Famiglie", "Families")}</button><h2>${esc(N(f, ""))}</h2><div class="griglia">` + f.modelli.map((x) => `
      <button class="carta" data-modello="${x.id}"><h3>${esc(N(x, ""))}</h3><p>${esc(N(x, "descr_"))}</p></button>`).join("") + "</div>";
    const arts = articoli(m, stato.scelte);
    return barraPassi(3) + `<button class="indietro" data-va="modelli">← ${esc(N(f, ""))}</button><h2>${esc(N(m, ""))}</h2>
      <div class="due"><div>` + m.scelte.map((g) => `
        <div class="scelta"><h3>${esc(N(g, ""))}</h3><div class="opzioni">${g.opzioni.map((o) => `
          <button class="opz" data-gruppo="${g.id}" data-opz="${o.id}" aria-pressed="${stato.scelte[g.id] === o.id}">${esc(N(o, ""))}${o.nota_it ? `<small>${esc(N(o, "nota_"))}</small>` : ""}</button>`).join("")}</div></div>`).join("") +
      (stato.scelte.dati && stato.scelte.dati !== "no" ? `<div class="scelta"><h3>${T("Moduli dati (2 per piastra)", "Data modules (2 per plate)")}</h3>
        <select id="modulo">${MODULI_DATI.map((x) => `<option value="${x.codice}" ${x.codice === stato.modulo ? "selected" : ""}>${esc(x.tipo)} · ${esc(N(x, ""))}</option>`).join("")}</select></div>` : "") +
      `</div><aside class="riepilogo"><h3>${T("Articoli per una torretta", "Parts for one outlet")}</h3>${tabella(arts, 1)}
        <div class="riga"><label>${T("Numero torrette", "Number of outlets")} <input type="number" id="quante" min="1" max="999" value="${stato.quante}" style="width:80px"></label></div>
        <div class="riga"><button class="btn btn-primario" id="aggiungi">${T("Aggiungi alla distinta", "Add to parts list")}</button></div>
      </aside></div>`;
  }

  function tabella(arts, molt) {
    if (!arts.length) return `<p class="vuoto">${T("Nessun articolo.", "No parts.")}</p>`;
    return `<table><thead><tr><th>${T("Codice", "Code")}</th><th>${T("Tipo", "Type")}</th><th class="nascondi-mobile">${T("Descrizione", "Description")}</th><th class="n">${T("Q.tà", "Qty")}</th></tr></thead><tbody>` +
      arts.map((a) => `<tr><td class="cod">${esc(a.codice)}</td><td>${esc(a.tipo)}</td><td class="nascondi-mobile">${esc(N(a, ""))}</td><td class="n">${a.qta * molt}</td></tr>`).join("") + "</tbody></table>";
  }

  function totali() {
    const m = new Map();
    for (const r of distinta) for (const a of r.articoli) { const x = m.get(a.codice) ?? { ...a, qta: 0 }; x.qta += a.qta * r.quante; m.set(a.codice, x); }
    return [...m.values()];
  }

  function vistaDistinta() {
    if (!distinta.length) return `<p class="vuoto">${T("La distinta è vuota: configura una torretta e premi “Aggiungi alla distinta”.", "The parts list is empty: configure an outlet and press “Add to parts list”.")}</p>`;
    return `<h2>${T("Configurazioni", "Configurations")}</h2><table><thead><tr><th>${T("Configurazione", "Configuration")}</th><th class="n">${T("Torrette", "Outlets")}</th><th class="noprint"></th></tr></thead><tbody>` +
      distinta.map((r, i) => `<tr><td>${esc(en() ? r.nome_en : r.nome_it)}</td><td class="n">${r.quante}</td><td class="n noprint"><button class="ib" data-togli="${i}" title="${T("Togli", "Remove")}">✕</button></td></tr>`).join("") +
      `</tbody></table><h2>${T("Totale articoli", "Total parts")}</h2>${tabella(totali(), 1)}
      <div class="riga noprint"><button class="btn btn-primario" id="excel">${T("Scarica Excel", "Download Excel")}</button>
      <button class="btn btn-bordo" id="stampa">${T("Stampa / PDF", "Print / PDF")}</button>
      <button class="btn btn-bordo" id="svuota">${T("Svuota", "Clear")}</button></div>
      <div class="avviso">${esc(N(NOTA_DATI, ""))}</div>`;
  }

  function tuttiArticoli() {
    const m = new Map();
    const visita = (x, fam, mod) => {
      if (Array.isArray(x)) x.forEach((y) => visita(y, fam, mod));
      else if (x && typeof x === "object") { if (x.codice) { if (!m.has(x.codice)) m.set(x.codice, { ...x, fam, mod }); } else Object.values(x).forEach((y) => visita(y, fam, mod)); }
    };
    for (const f of FAMIGLIE) for (const mo of f.modelli) visita([mo.scelte, mo.articoliPer ?? {}], f, mo);
    for (const x of MODULI_DATI) if (!m.has(x.codice)) m.set(x.codice, { ...x });
    return [...m.values()];
  }

  function vistaTrova() {
    const q = stato.cerca.trim().toLowerCase();
    const trovati = q ? tuttiArticoli().filter((a) => [a.codice, a.tipo, a.it, a.en].some((v) => String(v).toLowerCase().includes(q))) : [];
    return `<input type="search" id="cerca" value="${esc(stato.cerca)}" placeholder="${T("Codice, tipo o descrizione (es. 7408838, GES R2, cromo)", "Code, type or description (e.g. 7408838, GES R2, chrome)")}">` +
      (q ? (trovati.length ? `<p class="nota">${trovati.length} ${T("risultati", "results")}</p><table><thead><tr><th>${T("Codice", "Code")}</th><th>${T("Tipo", "Type")}</th><th>${T("Descrizione", "Description")}</th><th class="nascondi-mobile">${T("Famiglia", "Family")}</th></tr></thead><tbody>` +
        trovati.map((a) => `<tr><td class="cod">${esc(a.codice)}</td><td>${esc(a.tipo)}</td><td>${esc(N(a, ""))}</td><td class="nascondi-mobile">${a.mod ? `<button class="indietro" style="margin:0" data-apri="${a.fam.id}|${a.mod.id}">${esc(N(a.mod, ""))}</button>` : ""}</td></tr>`).join("") + "</tbody></table>"
        : `<p class="vuoto">${T("Nessun articolo trovato.", "No parts found.")}</p>`) : `<p class="nota">${T("Cerca tra tutti gli articoli del configuratore.", "Search all parts in the configurator.")}</p>`);
  }

  // ---------- azioni ----------
  $("vista").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.famiglia) { stato.famiglia = b.dataset.famiglia; stato.modello = null; const f = famiglia(); if (f.modelli.length === 1) scegliModello(f.modelli[0].id); }
    else if (b.dataset.modello) scegliModello(b.dataset.modello);
    else if (b.dataset.passo) { const p = Number(b.dataset.passo); if (p === 1) stato.famiglia = stato.modello = null; if (p === 2) stato.modello = null; }
    else if (b.dataset.va === "famiglie") stato.famiglia = null;
    else if (b.dataset.va === "modelli") { stato.modello = null; if (famiglia().modelli.length === 1) stato.famiglia = null; }
    else if (b.dataset.gruppo) stato.scelte[b.dataset.gruppo] = b.dataset.opz;
    else if (b.id === "aggiungi") {
      const m = modello(); const q = Math.max(1, Math.min(999, Number($("quante").value) || 1));
      const ling = localStorage.getItem("obo-lingua");
      scrivi("obo-lingua", null); const nome_it = nomeConfig(m, stato.scelte); scrivi("obo-lingua", "en"); const nome_en = nomeConfig(m, stato.scelte); scrivi("obo-lingua", ling);
      distinta.push({ nome_it, nome_en, quante: q, articoli: articoli(m, stato.scelte) }); salva();
      stato.scheda = "distinta";
    }
    else if (b.dataset.togli) { distinta.splice(Number(b.dataset.togli), 1); salva(); }
    else if (b.id === "svuota") { if (confirm(T("Svuotare la distinta?", "Clear the parts list?"))) { distinta = []; salva(); } }
    else if (b.id === "stampa") { window.print(); return; }
    else if (b.id === "excel") { scaricaExcel(); return; }
    else if (b.dataset.apri) { const [f, mo] = b.dataset.apri.split("|"); stato.famiglia = f; scegliModello(mo); stato.scheda = "configura"; }
    else return;
    disegna();
  });
  $("vista").addEventListener("input", (e) => {
    if (e.target.id === "cerca") { stato.cerca = e.target.value; disegna(); }
    else if (e.target.id === "quante") stato.quante = Math.max(1, Number(e.target.value) || 1);
    else if (e.target.id === "modulo") { stato.modulo = e.target.value; disegna(); }
  });
  function scegliModello(id) { stato.modello = id; stato.scelte = sceltePredefinite(modello()); stato.quante = 1; }

  function scaricaExcel() {
    // CSV con ";" e BOM: si apre direttamente in Excel con le colonne giuste.
    const c = (v) => `"${String(v).replace(/"/g, '""')}"`;
    const righe = [[T("Codice", "Code"), T("Tipo", "Type"), T("Descrizione", "Description"), T("Quantità", "Quantity")].map(c).join(";")];
    for (const a of totali()) righe.push([a.codice, a.tipo, N(a, ""), a.qta].map(c).join(";"));
    righe.push("", c(T("Configurazioni", "Configurations")));
    for (const r of distinta) righe.push([c(en() ? r.nome_en : r.nome_it), "", "", r.quante].join(";"));
    righe.push("", c(N(NOTA_DATI, "")));
    const blob = new Blob(["﻿" + righe.join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = `${T("distinta-torrette", "service-outlets-parts-list")}-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
</script>
</body>
