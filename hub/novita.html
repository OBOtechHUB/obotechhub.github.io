<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novità · OBO Hub</title>
<meta name="description" content="Registro degli aggiornamenti delle app di OBO Hub, con il testo pronto da inviare agli utenti.">
<link rel="icon" href="favicon-32.png">
<style>
  :root { --arancio:#f39b00; --arancio-scuro:#c47c00; --ardesia:#1f2a30; --testo:#1f2a30; --tenue:#5b6770; --bordo:#d9dee2; --grigio:#f3f5f6; --sfondo:#fff; --carta:#fff;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-tema="chiaro"]) { --testo:#e8ecef; --tenue:#a7b1b8; --bordo:#3a4750; --grigio:#26323a; --sfondo:#141b20; --carta:#1b252b; color-scheme: dark; } }
  :root[data-tema="scuro"] { --testo:#e8ecef; --tenue:#a7b1b8; --bordo:#3a4750; --grigio:#26323a; --sfondo:#141b20; --carta:#1b252b; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: calc(16px * var(--zoom, 1))/1.5 var(--font); color: var(--testo); background: var(--sfondo); }
  .contenitore { max-width: 960px; margin: 0 auto; padding: 0 16px; }
  .eroe { background: var(--ardesia); color: #fff; padding: 32px 0; }
  .eroe a { color: #fff; opacity: .85; text-decoration: none; font-size: 14px; }
  .eroe h1 { margin: 8px 0 0; font-size: clamp(26px, 4vw, 36px); }
  .eroe p { margin: 8px 0 0; opacity: .9; max-width: 680px; }
  main { padding: 24px 0 56px; }
  .filtri { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); align-items: end; }
  label span { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  select, input { width: 100%; padding: 9px 10px; border: 1px solid var(--bordo); border-radius: 8px; background: var(--carta); color: var(--testo); font: inherit; }
  .voce { border: .8px solid var(--bordo); border-radius: 12px; padding: 14px 16px; margin-top: 12px; background: var(--carta); }
  .voce h3 { margin: 0; font-size: 17px; }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--tenue); margin-bottom: 4px; }
  .app { font-weight: 600; padding: 2px 10px; border-radius: 999px; background: #fff4e0; color: var(--arancio-scuro); }
  ul { margin: 6px 0 0; padding-left: 20px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: 999px; border: 1px solid var(--bordo); background: var(--carta); color: var(--testo); font: 600 15px var(--font); cursor: pointer; text-decoration: none; }
  .btn-primario { background: var(--arancio); border-color: var(--arancio); color: #fff; }
  textarea { width: 100%; min-height: 260px; padding: 12px; border: 1px solid var(--bordo); border-radius: 10px; background: var(--carta); color: var(--testo); font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  h2 { font-size: 22px; margin: 32px 0 8px; }
  .nota { color: var(--tenue); font-size: 14px; }
  .vuoto { color: var(--tenue); margin-top: 24px; }
</style>
</head>
<body>
<section class="eroe"><div class="contenitore">
  <a href="./">← OBO Hub</a>
  <h1>Novità e aggiornamenti</h1>
  <p>Cosa è cambiato nelle app di OBO Hub. Scegli app e periodo e copia il testo pronto da inviare agli utenti.</p>
</div></section>
<main class="contenitore">
  <div class="filtri">
    <label><span>App</span><select id="app"><option value="">Tutte le app</option></select></label>
    <label><span>Periodo</span><select id="periodo">
      <option value="7">Ultima settimana</option><option value="30" selected>Ultimo mese</option><option value="90">Ultimi 3 mesi</option><option value="365">Ultimo anno</option><option value="0">Tutto</option><option value="da">Dalla data…</option></select></label>
    <label id="campoDa" hidden><span>Dal giorno</span><input type="date" id="da"></label>
  </div>
  <div id="elenco"></div>

  <h2>Testo da inviare agli utenti</h2>
  <p class="nota">Contiene le novità filtrate qui sopra. Puoi modificarlo prima di copiarlo.</p>
  <textarea id="testo" aria-label="Testo da inviare agli utenti"></textarea>
  <p style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
    <button class="btn btn-primario" id="copia" type="button">Copia testo</button>
    <a class="btn" id="email" href="#">Apri in email</a>
    <button class="btn" id="csv" type="button">Esporta CSV</button>
    <span id="esito" class="nota" role="status" style="align-self:center"></span>
  </p>
</main>
<script>
(function () {
  try { var t = localStorage.getItem("obo-tema"); if (t === "chiaro" || t === "scuro") document.documentElement.dataset.tema = t; var z = localStorage.getItem("obo-zoom"); if (z) document.documentElement.style.setProperty("--zoom", z); } catch (e) {}
  var NOMI = { hub: "OBO Hub", lps: "Progettazione LPS", mappa: "Mappa carichi ufficio tecnico", torrette: "Configuratore torrette", prodotti: "Prodotti OBO", tutte: "Tutte le app" };
  var FONTI = ["novita.json", "appOBOtechHUB/novita.json"];
  var tutte = [];
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (t) { return String(t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var data = function (d) { return new Date(d + "T12:00:00").toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric" }); };

  Object.keys(NOMI).filter(function (k) { return k !== "tutte"; }).forEach(function (k) { var o = document.createElement("option"); o.value = k; o.textContent = NOMI[k]; $("app").appendChild(o); });
  try { var q = new URLSearchParams(location.search).get("app"); if (q && NOMI[q]) $("app").value = q; } catch (e) {}

  function filtrate() {
    var app = $("app").value, p = $("periodo").value, da = "";
    if (p === "da") da = $("da").value; else if (p !== "0") { var d = new Date(); d.setDate(d.getDate() - Number(p)); da = d.toISOString().slice(0, 10); }
    return tutte.filter(function (a) { return (!app || a.app === app || a.app === "tutte") && (!da || a.data >= da); });
  }
  function testo(l) {
    if (!l.length) return "";
    var perApp = {};
    l.forEach(function (a) { (perApp[a.app] = perApp[a.app] || []).push(a); });
    var r = "Ciao,\n\nqueste sono le novità delle app di OBO Hub" + ($("periodo").value === "0" ? "" : " degli ultimi giorni") + ".\n";
    Object.keys(perApp).forEach(function (k) {
      r += "\n" + NOMI[k].toUpperCase() + "\n";
      perApp[k].forEach(function (a) { r += "\n• " + a.titolo + " (" + data(a.data) + ")\n"; (a.voci || []).forEach(function (v) { r += "  - " + v + "\n"; }); });
    });
    r += "\nPer avere la versione nuova apri l'app: compare la barra \"Aggiorna app\", premila e la pagina si ricarica.\nTutte le novità: " + location.origin + location.pathname + "\n\nhttps://obotechhub.github.io/\n";
    return r;
  }
  function disegna() {
    $("campoDa").hidden = $("periodo").value !== "da";
    var l = filtrate();
    $("elenco").innerHTML = l.length ? l.map(function (a) {
      return '<article class="voce"><div class="meta"><span class="app">' + esc(NOMI[a.app] || a.app) + "</span><span>" + esc(data(a.data)) + "</span></div><h3>" + esc(a.titolo) + "</h3>" +
        ((a.voci || []).length ? "<ul>" + a.voci.map(function (v) { return "<li>" + esc(v) + "</li>"; }).join("") + "</ul>" : "") + "</article>";
    }).join("") : '<p class="vuoto">Nessun aggiornamento nel periodo scelto.</p>';
    $("testo").value = testo(l);
    aggiornaEmail();
  }
  function aggiornaEmail() {
    var app = $("app").value;
    $("email").href = "mailto:?subject=" + encodeURIComponent("Novità " + (app ? NOMI[app] : "app OBO Hub")) + "&body=" + encodeURIComponent($("testo").value.slice(0, 1800));
  }
  $("testo").addEventListener("input", aggiornaEmail);
  ["app", "periodo", "da"].forEach(function (id) { $(id).addEventListener("change", disegna); });
  $("copia").addEventListener("click", function () {
    var fatto = function () { $("esito").textContent = "Testo copiato."; };
    if (navigator.clipboard) navigator.clipboard.writeText($("testo").value).then(fatto, function () { $("testo").select(); document.execCommand("copy"); fatto(); });
    else { $("testo").select(); document.execCommand("copy"); fatto(); }
  });
  $("csv").addEventListener("click", function () {
    var q = function (s) { return '"' + String(s).replace(/"/g, '""') + '"'; };
    var righe = [["Data", "App", "Aggiornamento", "Dettagli"].map(q).join(";")].concat(filtrate().map(function (a) { return [a.data, NOMI[a.app] || a.app, a.titolo, (a.voci || []).join(" · ")].map(q).join(";"); }));
    var b = new Blob(["﻿" + righe.join("\r\n")], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "novita-obo-hub.csv"; document.body.appendChild(a); a.click(); a.remove();
  });
  Promise.all(FONTI.map(function (f) { return fetch(f + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); }))
    .then(function (js) {
      js.forEach(function (j) { if (j && j.aggiornamenti) tutte = tutte.concat(j.aggiornamenti); });
      tutte.sort(function (a, b) { return a.data < b.data ? 1 : a.data > b.data ? -1 : (a.id < b.id ? 1 : -1); });
      disegna();
    });
})();
</script>
</body>
</html>
