<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<script src="../registro.js" data-app="spd"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conversione SPD · OBO Hub</title>
<meta name="theme-color" content="#ffffff">
<script>try{var z=Number(localStorage.getItem("obo-zoom"));if(z)document.documentElement.style.setProperty("--zoom",String(z))}catch(e){}</script>
<script>try{var t=localStorage.getItem("obo-tema");document.documentElement.dataset.theme=(t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches))?"dark":"light"}catch(e){}</script>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OBO Hub">
<style>
  :root { --arancio:#f39b00; --arancio-scuro:#c47c00; --ardesia:#41525d; --testo:#212529; --tenue:#6c757d; --bordo:#dee2e6; --sfondo:#fff; --grigio:#f5f6f7; --carta:#fff; --scelto:#fff4e0; --verde:#1d7a45;
    --font:"Nimbus Sans L","Nimbus Sans","Helvetica Neue",Helvetica,Arial,sans-serif; }
  :root[data-theme="dark"] { color-scheme:dark; --testo:#eef1f3; --tenue:#a7b4bc; --bordo:#3a454d; --sfondo:#1b1f23; --grigio:#242a2f; --ardesia:#2a3238; --carta:#242a2f; --scelto:#3d3020; --verde:#5fc58a; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  input[type=search]::-webkit-search-cancel-button { display:none; }
  html, body { margin:0; background:var(--sfondo); color:var(--testo); font-family:var(--font); }
  body { font-size:calc(15px * var(--zoom,1)); padding-bottom:env(safe-area-inset-bottom); }
  button, input, select { font:inherit; color:inherit; }
  a { color:inherit; }
  .contenitore { max-width:1140px; margin:0 auto; padding:0 16px; }
  header.barra { position:sticky; top:0; z-index:20; background:var(--carta); box-shadow:0 2px 10px rgba(0,0,0,.06); padding-top:env(safe-area-inset-top); }
  header.barra .contenitore { display:flex; align-items:center; justify-content:space-between; gap:8px; height:64px; }
  .marchio { display:flex; align-items:center; gap:10px; text-decoration:none; min-width:0; }
  .marchio img { width:36px; height:36px; border-radius:9px; }
  .marchio b { font-size:18px; white-space:nowrap; }
  .marchio small { display:block; font-size:12px; color:var(--tenue); }
  .azioni { display:flex; gap:2px; align-items:center; }
  .ib { border:0; background:none; cursor:pointer; padding:8px; border-radius:8px; font-weight:600; font-size:14px; min-width:40px; display:inline-flex; flex-direction:column; align-items:center; gap:2px; text-decoration:none; }
  .ib small { font-size:11px; font-weight:600; }
  .ib:hover, .ib[aria-pressed="true"] { color:var(--arancio); }
  .eroe { background:var(--ardesia); color:#fff; }
  .eroe .contenitore { padding-top:26px; padding-bottom:26px; }
  .eroe h1 { margin:0; font-size:calc(28px * var(--zoom,1)); }
  .eroe p { margin:6px 0 0; color:rgba(255,255,255,.85); }
  .stato { font-size:calc(13px * var(--zoom,1)); }
  .cerca { margin-top:16px; position:relative; max-width:760px; }
  .cerca input { width:100%; border:1px solid var(--bordo); border-radius:10px; padding:14px 44px 14px 46px; background:var(--carta); color:var(--testo); font-size:calc(16px * var(--zoom,1)); }
  .cerca input:focus { outline:2px solid var(--arancio); border-color:var(--arancio); }
  .cerca .lente { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--arancio); pointer-events:none; }
  .cerca .pulisci { position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:none; cursor:pointer; color:var(--tenue); font-size:20px; padding:6px 10px; }
  main { padding:20px 0 48px; }
  h2 { font-size:calc(22px * var(--zoom,1)); margin:28px 0 10px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  h2 small { font-size:calc(14px * var(--zoom,1)); color:var(--tenue); font-weight:400; }
  .filtri { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:0 0 12px; font-size:calc(14px * var(--zoom,1)); }
  .filtri label { max-width:100%; display:flex; align-items:center; gap:6px; }
  .filtri select { max-width:100%; min-width:0; border:1px solid var(--bordo); background:var(--carta); border-radius:8px; padding:6px 8px; }
  .lista { display:flex; flex-direction:column; gap:8px; }
  mark { background:var(--scelto); color:inherit; border-radius:3px; padding:0 1px; }
  .codici { width:100%; border-collapse:collapse; font-size:calc(14px * var(--zoom,1)); }
  .codici th, .codici td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--bordo); vertical-align:top; }
  .codici th { color:var(--tenue); font-size:calc(12px * var(--zoom,1)); }
  .ko { color:#c0392b; }
  .vuoto { color:var(--tenue); padding:20px 0; }
  .altro { margin-top:12px; }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:999px; border:1px solid var(--bordo); background:var(--carta); font-weight:600; cursor:pointer; text-decoration:none; }
  .btn-primario { background:var(--arancio); border-color:var(--arancio); color:#fff; }
  .nota { color:var(--tenue); font-size:calc(13px * var(--zoom,1)); margin-top:28px; }
  .cancello { max-width:440px; margin:12vh auto; text-align:center; padding:0 16px; }
  .cancello img { width:64px; height:64px; border-radius:14px; }
  .impost { position:relative; }
  .pannello-impost { position:absolute; right:0; top:calc(100% + 8px); z-index:30; min-width:290px; padding:14px; border:1px solid var(--bordo); border-radius:16px; background:var(--carta); box-shadow:0 12px 32px rgba(0,0,0,.18); display:flex; flex-direction:column; gap:10px; }
  .pannello-impost .riga { display:flex; align-items:center; justify-content:space-between; gap:12px; font-weight:600; }
  .seg { display:inline-flex; align-items:center; border:1px solid var(--bordo); border-radius:999px; overflow:hidden; }
  .seg button { border:0; background:none; padding:6px 12px; cursor:pointer; font-weight:600; }
  .seg button[aria-pressed="true"] { background:var(--arancio); color:#fff; }
  .seg .zv { min-width:48px; text-align:center; }
  @media (max-width:640px) { .prodotto { grid-template-columns:56px 1fr; } .prodotto img, .prodotto .noimg { width:56px; height:56px; } .prodotto .art { grid-column:2; } .art small { text-align:left; } .ib small { display:none; } }

  .viste { display:flex; gap:6px; flex-wrap:wrap; margin-top:16px; }
  .vista { border:1px solid rgba(255,255,255,.35); background:transparent; color:#fff; padding:8px 16px; border-radius:999px; cursor:pointer; font-weight:600; }
  .vista[aria-pressed="true"] { background:var(--arancio); border-color:var(--arancio); }
  textarea.codici-in { width:100%; min-height:90px; border:1px solid var(--bordo); border-radius:10px; padding:12px 14px; background:var(--carta); color:var(--testo); font:inherit; font-size:calc(16px * var(--zoom,1)); resize:vertical; }
  textarea.codici-in:focus, .campo input:focus, .campo select:focus { outline:2px solid var(--arancio); border-color:var(--arancio); }
  .risultato { border:1px solid var(--bordo); border-radius:14px; background:var(--carta); padding:14px; margin-top:12px; }
  .risultato > header { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:baseline; }
  .risultato h3 { margin:0; font-size:calc(18px * var(--zoom,1)); }
  .marca { display:inline-block; padding:2px 10px; border-radius:999px; background:var(--grigio); font-size:calc(12px * var(--zoom,1)); font-weight:700; }
  .dati { color:var(--tenue); font-size:calc(13px * var(--zoom,1)); }
  .proposte { display:grid; gap:10px; grid-template-columns:repeat(auto-fill, minmax(min(100%, 300px), 1fr)); margin-top:12px; }
  .proposta { border:1px solid var(--bordo); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:6px; min-width:0; }
  .proposta.prima { border-color:var(--arancio); background:var(--scelto); }
  .proposta .testa { display:flex; gap:10px; align-items:center; }
  .proposta img { width:56px; height:56px; object-fit:contain; background:#fff; border-radius:8px; flex:none; }
  .proposta b { display:block; font-size:calc(15px * var(--zoom,1)); overflow-wrap:anywhere; }
  .proposta .cod { font-variant-numeric:tabular-nums; font-weight:700; color:var(--arancio-scuro); }
  .esito { display:inline-block; padding:2px 10px; border-radius:999px; font-size:calc(12px * var(--zoom,1)); font-weight:700; color:#fff; background:var(--verde); }
  .esito.simile { background:#b26b00; } .esito.conf { background:var(--ardesia); }
  .voci { list-style:none; margin:0; padding:0; font-size:calc(13px * var(--zoom,1)); }
  .voci li { padding:2px 0 2px 22px; position:relative; }
  .voci li::before { position:absolute; left:0; font-weight:700; }
  .voci .ok::before { content:"✓"; color:var(--verde); } .voci .attenzione::before { content:"!"; color:#b26b00; left:5px; }
  .voci .no::before { content:"✕"; color:#c0392b; } .voci .info::before { content:"i"; color:var(--tenue); left:5px; font-style:italic; }
  .azioni-r { display:flex; gap:8px; flex-wrap:wrap; margin-top:auto; padding-top:6px; }
  .btn-piccolo { padding:6px 12px; font-size:calc(13px * var(--zoom,1)); }
  .modulo { display:grid; gap:14px; grid-template-columns:repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }
  .campo { display:flex; flex-direction:column; gap:4px; font-size:calc(14px * var(--zoom,1)); min-width:0; }
  .campo > span { font-weight:600; } .campo small { color:var(--tenue); font-weight:400; }
  .campo input, .campo select { border:1px solid var(--bordo); border-radius:8px; padding:9px 10px; background:var(--carta); color:var(--testo); width:100%; min-width:0; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--bordo); background:var(--carta); border-radius:999px; padding:6px 12px; cursor:pointer; font-weight:600; }
  .chip[aria-pressed="true"] { background:var(--arancio); border-color:var(--arancio); color:#fff; }
  .largo { grid-column:1 / -1; }
  .anteprima { margin-top:18px; border-top:1px solid var(--bordo); padding-top:6px; }
  .tab-scorri { overflow-x:auto; border:1px solid var(--bordo); border-radius:10px; }
  .tab-scorri table { min-width:760px; }
  .codici td, .codici th { padding:8px 6px; }
  .avviso { border-left:4px solid var(--arancio); background:var(--scelto); border-radius:8px; padding:10px 14px; font-size:calc(14px * var(--zoom,1)); margin:12px 0; }
  .avviso.rosso { border-color:#c0392b; background:#fdecea; color:#5c1410; }
  :root[data-theme="dark"] .avviso.rosso { background:#3a1a18; color:#f7d6d2; }
  .msg { font-size:calc(14px * var(--zoom,1)); }
</style>
</head>
<body>
<div id="cancello" class="cancello"><img src="../icona-192.png" alt=""><h1 data-t="Conversione SPD|SPD conversion"></h1><p id="cancelloMsg" data-t="Accesso con OBO Hub in corso…|Signing in with OBO Hub…"></p><p><a class="btn btn-primario" id="cancelloBtn" href="../" hidden data-t="Vai a OBO Hub|Go to OBO Hub"></a></p></div>
<div id="app" hidden>
  <header class="barra"><div class="contenitore">
    <a class="marchio" href="../" title="OBO Hub"><img src="../icona-192.png" alt=""><span><b data-t="Conversione SPD|SPD conversion"></b><small data-t="← OBO Hub|← OBO Hub"></small></span></a>
    <nav class="azioni" aria-label="Impostazioni">
      <div class="impost"><button class="ib" id="aspetto" aria-haspopup="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19 9 5l5 14M5.8 14h6.4M15 19l3-8 3 8M15.9 16.5h4.2"/></svg><small data-t="Aspetto|Display"></small></button><div class="pannello-impost" id="pannelloAspetto" hidden></div></div>
    </nav>
  </div></header>
  <section class="eroe"><div class="contenitore">
    <h1 data-t="Conversione SPD|SPD conversion"></h1>
    <p data-t="Dal codice di uno scaricatore di un'altra marca all'equivalente OBO, confrontando i dati tecnici.|From another brand's surge arrester code to the OBO equivalent, by comparing technical data."></p>
    <nav class="viste" aria-label="Sezioni">
      <button class="vista" data-vista="converti" aria-pressed="true" data-t="Converti codici|Convert codes"></button>
      <button class="vista" data-vista="aggiungi" data-t="Aggiungi SPD|Add SPD"></button>
      <button class="vista" data-vista="elenco" data-t="SPD di altre marche|Other brands' SPDs"></button>
      <button class="vista" data-vista="importa" data-t="Importa da Excel|Import from Excel"></button>
    </nav>
  </div></section>
  <main class="contenitore" id="vista"></main>
</div>
<script src="../manutenzione.js" data-sezione="app:spd"></script>
<script src="../aggiorna.js" data-versione="../version.json" data-app="spd"></script>
<script src="../piede.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
