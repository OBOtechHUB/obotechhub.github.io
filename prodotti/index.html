<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<script src="../registro.js" data-app="prodotti"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prodotti OBO · OBO Hub</title>
<meta name="theme-color" content="#ffffff">
<script>try{var z=Number(localStorage.getItem("obo-zoom"));if(z)document.documentElement.style.setProperty("--zoom",String(z))}catch(e){}</script>
<script>try{var t=localStorage.getItem("obo-tema");document.documentElement.dataset.theme=(t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches))?"dark":"light"}catch(e){}</script>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OBO Hub">
<style>
  :root { --arancio:#f39b00; --arancio-scuro:#c47c00; --ardesia:#41525d; --testo:#212529; --tenue:#6c757d; --bordo:#dee2e6; --sfondo:#fff; --grigio:#f5f6f7; --carta:#fff; --scelto:#fff4e0; --verde:#1d7a45;
    --font:"Nimbus Sans L","Nimbus Sans","Helvetica Neue",Helvetica,Arial,sans-serif; }
  :root[data-theme="dark"] { color-scheme:dark; --testo:#eef1f3; --tenue:#a7b4bc; --bordo:#3a454d; --sfondo:#1b1f23; --grigio:#242a2f; --ardesia:#2a3238; --carta:#242a2f; --scelto:#3d3020; --verde:#5fc58a; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  input[type=search]::-webkit-search-cancel-button { display:none; }
  html, body { margin:0; background:var(--sfondo); color:var(--testo); font-family:var(--font); }
  body { font-size:calc(15px * var(--zoom,1)); padding-bottom:env(safe-area-inset-bottom); }
  button, input, select { font:inherit; color:inherit; }
  a { color:inherit; }
  .contenitore { max-width:1140px; margin:0 auto; padding:0 16px; }
  header.barra { position:sticky; top:0; z-index:20; background:var(--carta); box-shadow:0 2px 10px rgba(0,0,0,.06); padding-top:env(safe-area-inset-top); }
  header.barra .contenitore { display:flex; align-items:center; justify-content:space-between; gap:8px; height:64px; }
  .marchio { display:flex; align-items:center; gap:10px; text-decoration:none; min-width:0; }
  .marchio img { width:36px; height:36px; border-radius:9px; }
  .marchio b { font-size:18px; white-space:nowrap; }
  .marchio small { display:block; font-size:12px; color:var(--tenue); }
  .azioni { display:flex; gap:2px; align-items:center; }
  .ib { border:0; background:none; cursor:pointer; padding:8px; border-radius:8px; font-weight:600; font-size:14px; min-width:40px; display:inline-flex; flex-direction:column; align-items:center; gap:2px; text-decoration:none; }
  .ib small { font-size:11px; font-weight:600; }
  .ib:hover, .ib[aria-pressed="true"] { color:var(--arancio); }
  .eroe { background:var(--ardesia); color:#fff; }
  .eroe .contenitore { padding-top:26px; padding-bottom:26px; }
  .eroe h1 { margin:0; font-size:calc(28px * var(--zoom,1)); }
  .eroe p { margin:6px 0 0; color:rgba(255,255,255,.85); }
  .stato { font-size:calc(13px * var(--zoom,1)); }
  .cerca { margin-top:16px; position:relative; max-width:760px; }
  .cerca input { width:100%; border:1px solid var(--bordo); border-radius:10px; padding:14px 44px 14px 46px; background:var(--carta); color:var(--testo); font-size:calc(16px * var(--zoom,1)); }
  .cerca input:focus { outline:2px solid var(--arancio); border-color:var(--arancio); }
  .cerca .lente { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--arancio); pointer-events:none; }
  .cerca .pulisci { position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:none; cursor:pointer; color:var(--tenue); font-size:20px; padding:6px 10px; }
  .suggerimento { color:rgba(255,255,255,.75); font-size:calc(13px * var(--zoom,1)); margin-top:6px; }
  main { padding:20px 0 48px; }
  h2 { font-size:calc(22px * var(--zoom,1)); margin:28px 0 10px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  h2 small { font-size:calc(14px * var(--zoom,1)); color:var(--tenue); font-weight:400; }
  .schede { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 14px; }
  .scheda { border:1px solid var(--bordo); background:var(--carta); padding:7px 14px; border-radius:999px; cursor:pointer; font-weight:600; }
  .scheda[aria-selected="true"] { background:var(--arancio); border-color:var(--arancio); color:#fff; }
  .scheda span { opacity:.8; font-weight:400; }
  .filtri { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:0 0 12px; font-size:calc(14px * var(--zoom,1)); }
  .cat { display:block; font-size:calc(12px * var(--zoom,1)); color:var(--tenue); font-weight:600; margin-bottom:1px; }
  .filtri label { max-width:100%; display:flex; align-items:center; gap:6px; }
  .filtri select { max-width:100%; min-width:0; border:1px solid var(--bordo); background:var(--carta); border-radius:8px; padding:6px 8px; }
  .lista { display:flex; flex-direction:column; gap:8px; }
  .prodotto { display:grid; grid-template-columns:72px 1fr auto; gap:12px; align-items:center; border:1px solid var(--bordo); border-radius:12px; padding:10px 12px; background:var(--carta); text-decoration:none; }
  .prodotto:hover { border-color:var(--arancio); }
  .prodotto img, .prodotto .noimg { width:72px; height:72px; object-fit:contain; background:#fff; border-radius:8px; }
  .prodotto .noimg { display:grid; place-items:center; color:var(--tenue); font-size:11px; border:1px dashed var(--bordo); }
  .prodotto h3 { margin:0; font-size:calc(16px * var(--zoom,1)); }
  .prodotto p { margin:2px 0 0; color:var(--tenue); font-size:calc(14px * var(--zoom,1)); }
  .art { font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap; }
  .art small { display:block; font-weight:400; color:var(--tenue); font-size:calc(12px * var(--zoom,1)); text-align:right; }
  .nuovo { display:inline-block; background:var(--arancio); color:#fff; border-radius:999px; padding:1px 8px; font-size:calc(11px * var(--zoom,1)); font-weight:700; margin-left:6px; vertical-align:2px; }
  mark { background:var(--scelto); color:inherit; border-radius:3px; padding:0 1px; }
  .griglia { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:12px; }
  .carta { border:1px solid var(--bordo); background:var(--carta); border-radius:12px; overflow:hidden; text-decoration:none; display:flex; flex-direction:column; }
  .carta:hover { border-color:var(--arancio); }
  .carta .foto { aspect-ratio:4/3; background:#fff; display:grid; place-items:center; overflow:hidden; }
  .carta .foto img { width:100%; height:100%; object-fit:contain; }
  .carta .foto.copri img { object-fit:cover; }
  .carta .corpo { padding:10px 12px 12px; display:flex; flex-direction:column; gap:4px; }
  .carta h3 { margin:0; font-size:calc(15px * var(--zoom,1)); }
  .carta p { margin:0; color:var(--tenue); font-size:calc(13px * var(--zoom,1)); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .data { color:var(--arancio-scuro); font-size:calc(12px * var(--zoom,1)); font-weight:700; }
  .voce { border:1px solid var(--bordo); border-radius:12px; padding:12px 14px; background:var(--carta); text-decoration:none; display:block; }
  .voce:hover { border-color:var(--arancio); }
  .voce h3 { margin:0; font-size:calc(16px * var(--zoom,1)); }
  .voce p { margin:4px 0 0; color:var(--tenue); font-size:calc(14px * var(--zoom,1)); }
  .sezione { color:var(--arancio-scuro); font-size:calc(12px * var(--zoom,1)); font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
  .albero ul { list-style:none; margin:0; padding-left:18px; border-left:1px dashed var(--bordo); }
  .albero > ul { padding-left:0; border:0; }
  .albero li { margin:2px 0; }
  .albero button { border:0; background:none; cursor:pointer; padding:4px 2px; font-weight:600; text-align:left; }
  .albero a { text-decoration:none; padding:4px 2px; display:inline-block; }
  .albero a:hover, .albero button:hover { color:var(--arancio); }
  .radici { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:10px; margin-bottom:14px; }
  .radice { border:1px solid var(--bordo); background:var(--carta); border-radius:12px; padding:14px; cursor:pointer; text-align:left; font-weight:700; }
  .radice[aria-pressed="true"] { border-color:var(--arancio); background:var(--scelto); }
  .radice small { display:block; color:var(--tenue); font-weight:400; margin-top:2px; }
  .codici { width:100%; border-collapse:collapse; font-size:calc(14px * var(--zoom,1)); }
  .codici th, .codici td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--bordo); vertical-align:top; }
  .codici th { color:var(--tenue); font-size:calc(12px * var(--zoom,1)); }
  .ko { color:#c0392b; }
  .vuoto { color:var(--tenue); padding:20px 0; }
  .altro { margin-top:12px; }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:999px; border:1px solid var(--bordo); background:var(--carta); font-weight:600; cursor:pointer; text-decoration:none; }
  .btn-primario { background:var(--arancio); border-color:var(--arancio); color:#fff; }
  .nota { color:var(--tenue); font-size:calc(13px * var(--zoom,1)); margin-top:28px; }
  .cancello { max-width:440px; margin:12vh auto; text-align:center; padding:0 16px; }
  .cancello img { width:64px; height:64px; border-radius:14px; }
  .impost { position:relative; }
  .pannello-impost { position:absolute; right:0; top:calc(100% + 8px); z-index:30; min-width:290px; padding:14px; border:1px solid var(--bordo); border-radius:16px; background:var(--carta); box-shadow:0 12px 32px rgba(0,0,0,.18); display:flex; flex-direction:column; gap:10px; }
  .pannello-impost .riga { display:flex; align-items:center; justify-content:space-between; gap:12px; font-weight:600; }
  .seg { display:inline-flex; align-items:center; border:1px solid var(--bordo); border-radius:999px; overflow:hidden; }
  .seg button { border:0; background:none; padding:6px 12px; cursor:pointer; font-weight:600; }
  .seg button[aria-pressed="true"] { background:var(--arancio); color:#fff; }
  .seg .zv { min-width:48px; text-align:center; }
  @media (max-width:640px) { .prodotto { grid-template-columns:56px 1fr; } .prodotto img, .prodotto .noimg { width:56px; height:56px; } .prodotto .art { grid-column:2; } .art small { text-align:left; } .ib small { display:none; } }
</style>
</head>
<body>
<div id="cancello" class="cancello"><img src="../icona-192.png" alt=""><h1 data-t="Prodotti OBO|OBO products"></h1><p id="cancelloMsg" data-t="Accesso con OBO Hub in corso…|Signing in with OBO Hub…"></p><p><a class="btn btn-primario" id="cancelloBtn" href="../" hidden data-t="Vai a OBO Hub|Go to OBO Hub"></a></p></div>

<div id="app" hidden>
  <header class="barra"><div class="contenitore">
    <a class="marchio" href="../" title="OBO Hub"><img src="../icona-192.png" alt=""><span><b data-t="Prodotti OBO|OBO products"></b><small data-t="← OBO Hub|← OBO Hub"></small></span></a>
    <nav class="azioni" aria-label="Sezioni">
      <button class="ib" data-vista="home" aria-pressed="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><small data-t="Prodotti|Products"></small></button>
      <button class="ib" data-vista="novita"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg><small data-t="Novità|New"></small></button>
      <button class="ib" data-vista="codici"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg><small data-t="Codici|Codes"></small></button>
      <div class="impost"><button class="ib" id="aspetto" aria-haspopup="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19 9 5l5 14M5.8 14h6.4M15 19l3-8 3 8M15.9 16.5h4.2"/></svg><small data-t="Aspetto|Display"></small></button><div class="pannello-impost" id="pannelloAspetto" role="dialog" hidden></div></div>
    </nav>
  </div></header>
  <section class="eroe"><div class="contenitore">
    <h1 data-t="Prodotti OBO|OBO products"></h1>
    <p class="stato" id="stato"></p>
    <div class="cerca">
      <svg class="lente" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" enterkeyhint="search">
      <button class="pulisci" id="pulisci" type="button" aria-label="Cancella" hidden>×</button>
    </div>
    <p class="suggerimento" data-t="Cerca per nome, descrizione o numero d'articolo. Più parole: devono esserci tutte. Più codici separati da virgola o spazio: li cerca tutti insieme.|Search by name, description or article number. Several words: all must match. Several codes separated by comma or space: finds them all at once."></p>
  </div></section>
  <main class="contenitore" id="vista"></main>
  <div class="contenitore"><p class="nota" id="fonte"></p></div>
</div>
<script type="module" src="app.js"></script>
<script src="../manutenzione.js" data-sezione="app:prodotti"></script>
<script src="../aggiorna.js" data-versione="../version.json" data-app="prodotti"></script>
<script src="../piede.js"></script>
</body>
</html>
